    rows += '<tr id="ma-row-' + ma.id + '" style="border-bottom:1px solid #f1f5f9;opacity:' + (inAusw ? '1' : '0.45') + '">'
      // Name
      + '<td style="padding:12px 8px">'
      + '<div style="font-weight:600;font-size:14px">' + name + '</div>'
      + '<div style="font-size:11px;color:#94a3b8">' + (ma.email || '') + '</div>'
      + '</td>'
      // Toggle In Auswertung
      + '<td style="padding:12px 8px;text-align:center">'
      + '<div class="toggle-wrap" style="justify-content:center">'
      + '<label class="toggle"><input id="toggle-' + ma.id + '" type="checkbox"' + (inAusw ? ' checked' : '') + ' onchange="toggleAuswertung(\'' + ma.id + '\', this.checked)"><span class="slider"></span></label>'
      + '<span id="label-' + ma.id + '" style="font-size:12px;font-weight:600;color:' + (inAusw ? '#15803d' : '#94a3b8') + '">' + (inAusw ? 'In Auswertung' : 'Ausgeschlossen') + '</span>'
      + '</div>'
      + '</td>'
      // Arbeitstage (Wochentag-Checkboxen)
      + '<td style="padding:12px 8px;text-align:center">' + atHtml + '</td>'
      // Soll-Modus (Auto/Manuell)
      + '<td style="padding:12px 8px;text-align:center">'
      + '<select class="proj-select" style="min-width:100px;max-width:140px" onchange="onSollModusChange(\'' + ma.id + '\', this)">'
      + '<option value="auto"' + (sollModus === 'auto' ? ' selected' : '') + '>SOKA-BAU</option>'
      + '<option value="manuell"' + (sollModus === 'manuell' ? ' selected' : '') + '>Manuell</option>'
      + '</select>'
      + '</td>'
      // Wochen-Stunden (nur bei manuell aktiv)
      + '<td style="padding:12px 8px;text-align:right;white-space:nowrap">'
      + '<input id="wh-' + ma.id + '" class="eins-input" type="number" min="1" max="60" step="0.5" value="' + (ma.wochen_stunden || 40) + '"'
      + (sollModus !== 'manuell' ? ' disabled' : '')
      + ' onchange="onWochenStundenChange(\'' + ma.id + '\', this)"'
      + ' onblur="onWochenStundenChange(\'' + ma.id + '\', this)">'
      + '<span class="eins-unit">h/Wo</span>'
      + '</td>'
      // ÜS-Startwert
      + '<td style="padding:12px 8px;text-align:right;white-space:nowrap">'
      + '<input class="eins-input" type="number" step="0.5" value="' + (ma.ueberstunden_start || 0) + '"'
      + ' onchange="onUeberstundenStartChange(\'' + ma.id + '\', this)"'
      + ' onblur="onUeberstundenStartChange(\'' + ma.id + '\', this)">'
      + '<span class="eins-unit">h</span>'
      + '</td>'
      // Standard-Projekt
      + '<td style="padding:12px 8px">'
      + buildProjektSelect(ma.id, ma.standard_projekt_id || '', ma.standard_projekt_name || '', projekte)
      + '</td>'
      // Status-Anzeige (Feedback)
      + '<td style="padding:12px 8px;text-align:center;width:32px">'
      + '<span id="save-status-' + ma.id + '" class="save-status"></span>'
      + '</td>'
      + '</tr>';
  });

  const html = css
    + '<div style="padding:20px;max-width:780px">'
    + '<h2 style="font-size:18px;font-weight:700;margin-bottom:6px">Mitarbeiter-Einstellungen</h2>'
    + '<p style="font-size:13px;color:#64748b;margin-bottom:20px">Soll-Stunden und Stundensatz direkt bearbeiten — Änderungen werden sofort gespeichert. Mitarbeiter ohne Craftboxx-Stempelung können aus Auswertungen ausgeschlossen werden.</p>'
    + '<div class="chart-card" style="padding:0">'
    + '<table style="width:100%;border-collapse:collapse">'
    + '<thead><tr style="border-bottom:2px solid #e2e8f0;background:#f8fafc">'
    + '<th style="text-align:left;padding:10px 8px;font-size:12px;color:#64748b;font-weight:600">MITARBEITER</th>'
    + '<th style="text-align:center;padding:10px 8px;font-size:12px;color:#64748b;font-weight:600">IN AUSWERTUNG</th>'
    + '<th style="text-align:center;padding:10px 8px;font-size:12px;color:#64748b;font-weight:600">ARBEITSTAGE</th>'
    + '<th style="text-align:center;padding:10px 8px;font-size:12px;color:#64748b;font-weight:600">SOLL-MODUS</th>'
    + '<th style="text-align:right;padding:10px 8px;font-size:12px;color:#64748b;font-weight:600">WOCHEN-H</th>'
    + '<th style="text-align:right;padding:10px 8px;font-size:12px;color:#64748b;font-weight:600">ÜS-START</th>'
    + '<th style="text-align:left;padding:10px 8px;font-size:12px;color:#64748b;font-weight:600">STANDARD-PROJEKT</th>'
    + '<th style="padding:10px 8px"></th>'
    + '</tr></thead>'
    + '<tbody>' + rows + '</tbody>'
    + '</table>'
    + '</div>'
    + '<p style="font-size:11px;color:#94a3b8;margin-top:12px">Tipp: Tab-Taste zum schnellen Wechsel zwischen Feldern. Änderungen wirken sofort auf alle Auswertungen.</p>'
    + '</div>';

  document.getElementById('main-content').innerHTML = html;
}

// =====================================================
// PDF Lohnzettel Export (jsPDF)
// =====================================================
async function exportPDFLohnzettel() {
  if (!state.dashData) {
    alert('Bitte zuerst den Monat laden (Monatsansicht öffnen).');
    return;
  }
  const data = state.dashData;
  const monat = data.monat || state.monat;
  const [yjahr, ymon] = monat.split('-').map(Number);
  const monatName = MONAT_NAMEN[ymon - 1] + ' ' + yjahr;

  // Abwesenheiten + Timesheets + Stundenzettel-Detail (Planner-Kundenzuordnung) laden
  let abwData = [], tsData = [], detailData = {};
  try {
    const detailUrl = '/stundenzettel-detail?monat=' + monat + (state.maFilter ? '&mitarbeiter_id=' + state.maFilter : '');
    const [abw, ts, detail] = await Promise.all([
      apiFetch('/abwesenheiten?monat=' + monat),
      apiFetch('/timesheets?monat=' + monat),
      apiFetch(detailUrl).catch(() => ({ mitarbeiter: [] })),
    ]);
    abwData = abw;
    tsData = ts;
    (detail.mitarbeiter || []).forEach(m => { detailData[m.user_id] = m; });
  } catch(e) { /* ignorieren */ }

  const { jsPDF } = window.jspdf;

  // MA-Filter: wenn gesetzt nur diesen MA, sonst alle aktiven
  const maListe = (data.mitarbeiter || []).filter(m => {
    if (state.maFilter) return m.user_id === state.maFilter;
    return m.arbeit_sek > 0;
  });

  if (maListe.length === 0) {
    alert('Keine Mitarbeiter mit Daten für diesen Monat.');
    return;
  }

  // Arbeitstage-Helfer (identisch zu renderMonat)
  function atSet2(atStr) {
    return new Set((atStr || '1,2,3,4,5').split(',').map(x => parseInt(x)).filter(n => !isNaN(n)));
  }
  function maArbeitstage(atStr, nurBisHeute) {
    const set = atSet2(atStr);
    let count = 0;
    const heute = new Date();
    const bis = nurBisHeute ? new Date(heute.getFullYear(), heute.getMonth(), heute.getDate()) : null;
    const d = new Date(yjahr, ymon - 1, 1);
    while (d.getMonth() === ymon - 1) {
      if (set.has(d.getDay()) && (!bis || d <= bis)) count++;
      d.setDate(d.getDate() + 1);
    }
    return count;
  }
  const heute = new Date();
  const istLaufend = yjahr === heute.getFullYear() && ymon === heute.getMonth() + 1;
  const gesamtATGlobal = data.arbeitstage || 20;

  // Ein PDF mit allen MAs (eine Seite pro MA)
  const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  const W = 210; const H = 297;
  const marginL = 18; const marginR = 18; const contentW = W - marginL - marginR;

  maListe.forEach((ma, idx) => {
    if (idx > 0) doc.addPage();

    // ── Hilfsfunktionen ──────────────────────────────────────────────────────
    const hh = s => { const h = Math.floor(s/3600); const m = Math.floor((s%3600)/60); return `${h}h ${m}m`; };
    const hDec = s => (s/3600).toFixed(2) + ' h';
    const pct = (a,b) => b > 0 ? Math.round(a/b*100) : 0;

    // ── Timesheets + Abwesenheiten dieses MA ─────────────────────────────────
    const maAbw = abwData.filter(a => a.user_id === ma.user_id);
    const maTs  = tsData.filter(t => t.employee_id === ma.user_id)
                        .sort((a, b) => (a.datum + a.started_at).localeCompare(b.datum + b.started_at));
    const urlaubTage  = maAbw.filter(a => (a.type_name||'').toLowerCase().includes('urlaub') && !((a.type_name||'').toLowerCase().includes('sonder'))).length;
    const krankTage   = maAbw.filter(a => (a.type_name||'').toLowerCase().includes('krank')).length;
    const sonderTage  = maAbw.filter(a => (a.type_name||'').toLowerCase().includes('sonder')).length;
    const fortTage    = maAbw.filter(a => (a.type_name||'').toLowerCase().includes('fort') || (a.type_name||'').toLowerCase().includes('schul')).length;

    // ── Soll/Ist pro MA (Backend-berechnet mit Feiertagen + SOKA-BAU) ──────
    const sollH = istLaufend ? (ma.soll_bis_heute_h || 0) : (ma.soll_monat_h || 0);
    const abwH = ma.abwesenheits_gutschrift_h || 0;
    const sollSek = Math.round(sollH * 3600);
    const istSek  = (ma.arbeit_sek || 0);
    const diffSek = istSek + Math.round(abwH * 3600) - sollSek;
    const diffSign = diffSek >= 0 ? '+' : '';

    // ── Farben ───────────────────────────────────────────────────────────────
    const ROT   = [185, 28, 28];
    const DUNKEL= [30,  41,  59];
    const GRAU  = [100, 116, 139];
    const HELL  = [241, 245, 249];
    const GRUEN = [21, 128, 61];
    const GELB  = [180, 83, 9];

    // ── KOPFZEILE (roter Header) ─────────────────────────────────────────────
    doc.setFillColor(...ROT);
    doc.rect(0, 0, W, 32, 'F');

    doc.setTextColor(255, 255, 255);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(16);
    doc.text('Arbeitszeit-Nachweis', marginL, 12);

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    doc.text('ISOTEC Ottsen — Abrechnungsmonat: ' + monatName, marginL, 18.5);
    doc.text('Erstellungsdatum: ' + new Date().toLocaleDateString('de-DE', {day:'2-digit',month:'2-digit',year:'numeric'}), marginL, 23.5);
    doc.text('Dokument gemäß §21a ArbZG / §4 NachwG', marginL, 28.5);

    // ISOTEC rechts
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(18);
    doc.text('ISOTEC', W - marginR - 1, 14, {align: 'right'});
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(8);
    doc.text('Ottsen & Kernpartner', W - marginR - 1, 19, {align: 'right'});
    doc.text('Abdichtungstechnik GmbH', W - marginR - 1, 23.5, {align: 'right'});

    let y = 40;

    // ── MA-INFO BLOCK ─────────────────────────────────────────────────────────
    doc.setFillColor(...HELL);
    doc.roundedRect(marginL, y, contentW, 22, 3, 3, 'F');

    doc.setTextColor(...DUNKEL);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(13);
    doc.text(ma.user_name || '–', marginL + 5, y + 8);

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(8);
    doc.setTextColor(...GRAU);
    const atNamen = ['Mo', 'Di', 'Mi', 'Do', 'Fr'];
    const atSet3 = atSet2(ma.arbeitstage);
    const atAnzeige = atNamen.filter((_, i) => atSet3.has(i + 1)).join(', ');
    doc.text('Arbeitstage: ' + atAnzeige + '  |  Soll-Stunden/Monat: ' + ma.soll_stunden + ' h  |  Abrechnungsmonat: ' + monatName, marginL + 5, y + 14);
    doc.text('Mitarbeiter-ID: ' + ma.user_id, marginL + 5, y + 19);

    y += 28;

    // ── STUNDEN-ÜBERSICHT (KPI-Karten) ───────────────────────────────────────
    doc.setTextColor(...DUNKEL);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(9);
    doc.text('ARBEITSZEITNACHWEIS', marginL, y);

    const linienY = y + 1.5;
    doc.setDrawColor(...ROT);
    doc.setLineWidth(0.5);
    doc.line(marginL, linienY, marginL + 60, linienY);
    doc.setDrawColor(200, 200, 200);
    doc.line(marginL + 62, linienY, marginL + contentW, linienY);

    y += 6;

    // 4 KPI-Boxen nebeneinander
    const boxW = (contentW - 9) / 4;
    const kpiData = [
      { lbl: 'SOLL-STUNDEN',   val: hh(sollSek),           sub: (ma.soll_modus === 'manuell' ? (ma.wochen_stunden || 40) + 'h/Wo' : 'SOKA-BAU'),    farbe: GRAU },
      { lbl: 'IST + ABW.',     val: hh(istSek + Math.round(abwH * 3600)), sub: (abwH > 0 ? '+' + abwH.toFixed(1) + 'h Abwesenheit' : ma.tage + ' Tage gearbeitet'), farbe: ROT },
      { lbl: 'DIFFERENZ',      val: diffSign + hh(Math.abs(diffSek)), sub: diffSign + (diffSek/3600).toFixed(1) + ' h', farbe: diffSek >= 0 ? GRUEN : GELB },
      { lbl: 'EINTRÄGE',       val: '' + ma.eintraege,      sub: 'Buchungen im Monat',             farbe: GRAU },
    ];

    kpiData.forEach((k, i) => {
      const bx = marginL + i * (boxW + 3);
      doc.setFillColor(248, 250, 252);
      doc.roundedRect(bx, y, boxW, 20, 2, 2, 'F');
      doc.setDrawColor(226, 232, 240);
      doc.setLineWidth(0.3);
      doc.roundedRect(bx, y, boxW, 20, 2, 2, 'S');

      doc.setTextColor(...GRAU);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(6.5);
      doc.text(k.lbl, bx + 4, y + 5);

      doc.setTextColor(...k.farbe);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(11);
      doc.text(k.val, bx + 4, y + 13);

      doc.setTextColor(...GRAU);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(6.5);
      doc.text(k.sub, bx + 4, y + 18);
    });

    y += 26;

    // ── ARBEITSZEIT DETAIL ────────────────────────────────────────────────────
    doc.setTextColor(...DUNKEL);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(9);
    doc.text('DETAILLIERTE ARBEITSZEITAUSWERTUNG', marginL, y);
    doc.setDrawColor(...ROT);
    doc.setLineWidth(0.5);
    doc.line(marginL, y + 1.5, marginL + 80, y + 1.5);

    y += 7;

    // Tabelle mit Zeilen
    const felder = [
      ['Soll-Stunden (Monat)', ma.soll_stunden + ' h / Monat'],
      ['Arbeitstage (Soll)', maArbeitstage(ma.arbeitstage, false) + ' Tage'],
      ['Arbeitstage (Ist)', ma.tage + ' Tage gearbeitet'],
      ['Erfasste Arbeitszeit (Ist)', hh(istSek) + '  =  ' + hDec(istSek)],
      ['Pausenzeit gesamt', hh(ma.pause_sek || 0)],
      ['Differenz Soll/Ist', diffSign + hh(Math.abs(diffSek)) + '  (' + diffSign + (diffSek/3600).toFixed(2) + ' h)'],
      ['Auslastung', pct(istSek, sollSek) + ' % der Soll-Arbeitszeit'],
      ['Buchungs-Einträge', ma.eintraege + ' Einträge in Craftboxx'],
    ];

    felder.forEach((f, i) => {
      const rowY = y + i * 7;
      if (i % 2 === 0) {
        doc.setFillColor(248, 250, 252);
        doc.rect(marginL, rowY - 3, contentW, 7, 'F');
      }
      doc.setTextColor(...GRAU);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(8);
      doc.text(f[0], marginL + 4, rowY + 1);

      doc.setTextColor(...DUNKEL);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(8);
      doc.text(f[1], marginL + contentW - 4, rowY + 1, {align: 'right'});

      doc.setDrawColor(226, 232, 240);
      doc.setLineWidth(0.2);
      doc.line(marginL, rowY + 4, marginL + contentW, rowY + 4);
    });

    y += felder.length * 7 + 6;

    // ── TÄGLICHE BUCHUNGEN ────────────────────────────────────────────────────
    // Neue Seite für Buchungsdetails falls Platz knapp
    doc.addPage();
    y = 20;

    // Mini-Header oben auf Folgeseite
    doc.setFillColor(...ROT);
    doc.rect(0, 0, W, 10, 'F');
    doc.setTextColor(255,255,255);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(8);
    doc.text(`Stundennachweis – ${ma.user_name} – ${monatName}`, marginL, 7);
    doc.text('Tägliche Buchungsübersicht', W - marginR - 1, 7, {align: 'right'});
    y = 16;

    doc.setTextColor(...DUNKEL);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(9);
    doc.text('TÄGLICHE BUCHUNGSÜBERSICHT', marginL, y);
    doc.setDrawColor(...ROT);
    doc.setLineWidth(0.5);
    doc.line(marginL, y + 1.5, marginL + 70, y + 1.5);
    y += 7;

    // Tabellenkopf — eine Zeile pro Tag (aggregiert)
    const colDatum  = marginL;
    const colWT     = marginL + 28;
    const colStart  = marginL + 40;
    const colEnde   = marginL + 54;
    const colNetto  = marginL + 68;
    const colPause  = marginL + 86;
    const colAnzahl = marginL + 104;
    const colProjekt = marginL + 116;

    const _drawTblHeader = () => {
      doc.setFillColor(30, 41, 59);
      doc.rect(marginL, y - 3.5, contentW, 7, 'F');
      doc.setTextColor(255,255,255);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(7);
      doc.text('DATUM',        colDatum  + 1, y + 0.5);
      doc.text('TAG',          colWT     + 1, y + 0.5);
      doc.text('BEGINN',       colStart  + 1, y + 0.5);
      doc.text('ENDE',         colEnde   + 1, y + 0.5);
      doc.text('NETTO',        colNetto  + 1, y + 0.5);
      doc.text('PAUSE',        colPause  + 1, y + 0.5);
      doc.text('BUCHUNGEN',    colAnzahl + 1, y + 0.5);
      doc.text('PROJEKT',       colProjekt + 1, y + 0.5);
      y += 5;
    };
    _drawTblHeader();

    const WT_KURZ = ['So','Mo','Di','Mi','Do','Fr','Sa'];
    const zeilenHoehe = 6.5;

    // Timesheets nach Datum aggregieren (eine Zeile pro Tag)
    const tageAgg = {};
    maTs.forEach(ts => {
      if (!tageAgg[ts.datum]) {
        tageAgg[ts.datum] = {
          datum: ts.datum,
          started_at: ts.started_at || '–',
          ended_at:   ts.ended_at   || '–',
          netto_sek:  0,
          pause_sek:  0,
          anzahl:     0,
          notizen:    [],
          projekt:    ts.projekt || '',
        };
      }
      const tag = tageAgg[ts.datum];
      tag.netto_sek += ts.netto_sek || 0;
      tag.pause_sek += ts.pause_sek || 0;
      tag.anzahl    += 1;
      // Frühester Start, spätestes Ende
      if (ts.started_at && ts.started_at < tag.started_at) tag.started_at = ts.started_at;
      if (ts.ended_at   && ts.ended_at   > tag.ended_at)   tag.ended_at   = ts.ended_at;
      if (ts.notiz) tag.notizen.push(ts.notiz);
      // Use the saved project assignment (prefer hat_manuelles_projekt entry)
      if (ts.hat_manuelles_projekt && ts.projekt) tag.projekt = ts.projekt;
      else if (!tag.projekt && ts.projekt) tag.projekt = ts.projekt;
    });
    // Planner-Kundendaten einmischen (überschreibt Timesheet-Projekt wenn Planner verfügbar)
    const maDetailPDF = detailData[ma.user_id];
    if (maDetailPDF && maDetailPDF.tage) {
      maDetailPDF.tage.forEach(pt => {
        if (pt.kunde && tageAgg[pt.datum]) {
          tageAgg[pt.datum].projekt = pt.kunde;
        }
      });
    }

    const sortedTage = Object.values(tageAgg).sort((a,b) => a.datum.localeCompare(b.datum));

    if (sortedTage.length === 0) {
      doc.setTextColor(...GRAU);
      doc.setFont('helvetica', 'italic');
      doc.setFontSize(7.5);
      doc.text('Keine Buchungen für diesen Zeitraum vorhanden.', marginL + 4, y + 3);
      y += 10;
    } else {
      sortedTage.forEach((tag, i) => {
        // Seitenumbruch prüfen
        if (y + zeilenHoehe > H - 18) {
          doc.addPage();
          doc.setFillColor(...ROT);
          doc.rect(0, 0, W, 10, 'F');
          doc.setTextColor(255,255,255);
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(8);
          doc.text(`Stundennachweis – ${ma.user_name} – ${monatName} (Fortsetzung)`, marginL, 7);
          y = 16;
          _drawTblHeader();
        }

        const d = new Date(tag.datum + 'T12:00:00');
        const wtName  = WT_KURZ[d.getDay()];
        const datumDE = tag.datum.split('-').reverse().join('.');
        const netH = Math.floor(tag.netto_sek/3600);
        const netM = Math.floor((tag.netto_sek%3600)/60);
        const pauseM = Math.round(tag.pause_sek/60);
        const projektTxt = (tag.projekt || tag.notizen.filter(Boolean).join('; ')).substring(0, 50);

        const rowBg = i % 2 === 0 ? [255,255,255] : [248,250,252];
        doc.setFillColor(...rowBg);
        doc.rect(marginL, y - 1, contentW, zeilenHoehe, 'F');

        doc.setTextColor(...DUNKEL);
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(7.5);
        doc.text(datumDE,           colDatum  + 1, y + 3);
        doc.text(wtName,            colWT     + 1, y + 3);
        doc.text(tag.started_at,    colStart  + 1, y + 3);
        doc.text(tag.ended_at,      colEnde   + 1, y + 3);
        doc.setFont('helvetica', 'bold');
        doc.text(`${netH}h ${netM}m`, colNetto + 1, y + 3);
        doc.setFont('helvetica', 'normal');
        doc.setTextColor(...GRAU);
        doc.text(pauseM > 0 ? `${pauseM}m` : '–', colPause + 1, y + 3);
        doc.text(String(tag.anzahl),  colAnzahl + 1, y + 3);
        doc.setTextColor(100, 116, 139);
        doc.setFontSize(6.5);
        doc.text(projektTxt,          colProjekt + 1, y + 3);

        doc.setDrawColor(226, 232, 240);
        doc.setLineWidth(0.15);
        doc.line(marginL, y + zeilenHoehe - 1, marginL + contentW, y + zeilenHoehe - 1);
        y += zeilenHoehe;
      });

      // Gesamtsumme-Zeile
      y += 3;
      doc.setFillColor(...ROT);
      doc.rect(marginL, y - 2, contentW, 8, 'F');
      doc.setTextColor(255,255,255);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(8);
      const gesamtH = Math.floor(istSek/3600);
      const gesamtM = Math.floor((istSek%3600)/60);
      const gesamtPauseM = Math.round((ma.pause_sek||0)/60);
      doc.text('GESAMT', marginL + 4, y + 3.5);
      doc.text(`${gesamtH}h ${gesamtM}m`, colNetto + 1, y + 3.5);
      doc.text(`${gesamtPauseM}m`, colPause + 1, y + 3.5);
      doc.text(`${ma.eintraege} Buchungen`, colAnzahl + 1, y + 3.5);
      y += 12;
    }


    // Abwesenheiten + Rechtliches auf eigener Seite
    doc.addPage();
    // Mini-Header
    doc.setFillColor(...ROT);
    doc.rect(0, 0, W, 10, 'F');
    doc.setTextColor(255,255,255);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(8);
    doc.text(`Arbeitszeit-Nachweis – ${ma.user_name} – ${monatName}`, marginL, 7);
    doc.text('Abwesenheiten & Rechtliches', W - marginR - 1, 7, {align: 'right'});
    y = 20;

    // ── ABWESENHEITEN ──────────────────────────────────────────────────────────
    doc.setTextColor(...DUNKEL);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(9);
    doc.text('ABWESENHEITEN', marginL, y);
    doc.setDrawColor(...ROT);
    doc.setLineWidth(0.5);
    doc.line(marginL, y + 1.5, marginL + 45, y + 1.5);

    y += 7;

    const abwFelder = [
      ['Urlaub', urlaubTage + ' Tag' + (urlaubTage !== 1 ? 'e' : '')],
      ['Krankheit', krankTage + ' Tag' + (krankTage !== 1 ? 'e' : '')],
      ['Sonderurlaub', sonderTage + ' Tag' + (sonderTage !== 1 ? 'e' : '')],
      ['Fortbildung / Schulung', fortTage + ' Tag' + (fortTage !== 1 ? 'e' : '')],
    ];

    abwFelder.forEach((f, i) => {
      const rowY = y + i * 7;
      if (i % 2 === 0) {
        doc.setFillColor(248, 250, 252);
        doc.rect(marginL, rowY - 3, contentW, 7, 'F');
      }
      doc.setTextColor(...GRAU);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(8);
      doc.text(f[0], marginL + 4, rowY + 1);

      doc.setTextColor(...DUNKEL);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(8);
      doc.text(f[1], marginL + contentW - 4, rowY + 1, {align: 'right'});

      doc.setDrawColor(226, 232, 240);
      doc.setLineWidth(0.2);
      doc.line(marginL, rowY + 4, marginL + contentW, rowY + 4);
    });

    y += abwFelder.length * 7 + 4;

    // Einzelne Abwesenheitseinträge (falls vorhanden)
    if (maAbw.length > 0) {
      doc.setTextColor(...GRAU);
      doc.setFont('helvetica', 'italic');
      doc.setFontSize(7.5);
      maAbw.forEach((a, i) => {
        if (y + 6 > H - 35) return; // Seitenende vermeiden
        const von = a.date_from ? new Date(a.date_from).toLocaleDateString('de-DE') : '–';
        const bis = a.date_to   ? new Date(a.date_to  ).toLocaleDateString('de-DE') : von;
        const apprText = a.approved ? '✓ genehmigt' : '○ ausstehend';
        doc.text(
          '  • ' + (a.type_name || '–') + ':  ' + von + (von !== bis ? ' – ' + bis : '') + '  |  ' + apprText,
          marginL + 4, y + 2
        );
        y += 5.5;
      });
    } else {
      doc.setTextColor(...GRAU);
      doc.setFont('helvetica', 'italic');
      doc.setFontSize(7.5);
      doc.text('Keine Abwesenheiten erfasst.', marginL + 4, y + 2);
      y += 6;
    }

    y += 6;

    // ── RECHTLICHE PFLICHTANGABEN (ArbZG / NachwG) ────────────────────────────
    doc.setTextColor(...DUNKEL);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(9);
    doc.text('RECHTLICHE HINWEISE', marginL, y);
    doc.setDrawColor(...ROT);
    doc.setLineWidth(0.5);
    doc.line(marginL, y + 1.5, marginL + 48, y + 1.5);

    y += 7;

    const hinweise = [
      'Gemäß §21a ArbZG ist der Arbeitgeber verpflichtet, die Arbeitszeit der Arbeitnehmer aufzuzeichnen.',
      'Die Aufzeichnungspflicht umfasst Beginn, Ende und Dauer der täglichen Arbeitszeit.',
      'Aufzeichnungen sind min. 2 Jahre aufzubewahren (§21a Abs.7 ArbZG, §17 MiLoG).',
      'Dieser Nachweis dient als Stundennachweis gem. §17 Abs.1 Mindestlohngesetz (MiLoG).',
    ];
    hinweise.forEach(h => {
      const lines = doc.splitTextToSize(h, contentW - 4);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(7);
      doc.setTextColor(...GRAU);
      doc.text(lines, marginL + 4, y);
      y += lines.length * 4 + 1;
    });

    y += 4;

  });  // Ende maListe.forEach

  const dateiname = 'Lohnzettel_' + monat + (state.maFilter ? '_' + (maListe[0]?.user_name||'').replace(',','').trim().replace(/\s+/g,'_') : '_Alle') + '.pdf';
  doc.save(dateiname);
}

// =====================================================
// CSV Export
// =====================================================
function exportCSV() {
  if (!state.dashData) return;
  const rows = [['Mitarbeiter','Soll h','Ist h','Diff h','Arbeitszeit h','Fahrzeit h','Pause h','Tage','Einträge','Stundensatz','Lohnkosten']];
  (state.dashData.mitarbeiter||[]).forEach(ma => {
    const istH = (ma.arbeit_sek/3600).toFixed(2);
    const diff = (ma.arbeit_sek/3600 - ma.soll_stunden).toFixed(2);
    rows.push([
      ma.user_name, ma.soll_stunden, istH, diff,
      (ma.arbeitszeit_sek/3600).toFixed(2),
      (ma.fahrzeit_sek/3600).toFixed(2),
      (ma.pause_sek/3600).toFixed(2),
      ma.tage, ma.eintraege,
      ma.stundensatz,
      (ma.arbeit_sek/3600*ma.stundensatz).toFixed(2),
    ]);
  });
  const bom = '\uFEFF';
  const csv = bom + rows.map(r => r.join(';')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `iso-zeit-${state.monat}.csv`; a.click();
  URL.revokeObjectURL(url);
}
